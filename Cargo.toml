[package]
name = "openspeech"
version = "1.0.0"
edition = "2021"
description = "Mac 専用の医療向け音声入力"
license = "MIT"
repository = "https://github.com/Shintaro-Kano/openspeech"

[lib]
name = "openspeech"
path = "src/lib.rs"

[[bin]]
name = "openspeech"
path = "src/main.rs"

[features]
default = []

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.15"
hound = "3"
arboard = "3"
rfd = "0.15"
dirs = "6"
global-hotkey = "0.7"
libloading = "0.8"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSEvent", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder"] }
core-foundation = "0.10"
core-graphics = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
